name: Build & Release APK
on:
  push:
    tags: ['v*']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Make gradlew executable
        run: chmod +x ./gradlew
      - name: Build Debug APK
        run: gradle --no-daemon :app:assembleDebug
      - name: Generate Keystore and Sign APK
        run: |
          # Generate debug keystore on the runner
          keytool -genkey -v -keystore debug.keystore -keyalg RSA -keysize 2048 -validity 10000 -alias debug -storepass android -keypass android -dname "CN=Android Debug,O=Android,C=US"
          
          # Find apksigner in Android SDK
          APK_SIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -r | head -n 1)
          
          # Sign the APK
          $APK_SIGNER sign --ks debug.keystore --ks-pass pass:android --key-pass pass:android --ks-key-alias debug app/build/outputs/apk/debug/app-debug.apk
          
          # Rename the signed APK
          mv app/build/outputs/apk/debug/app-debug.apk app/build/outputs/apk/debug/OpenWallpaper-${{ github.ref_name }}.apk
      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: app/build/outputs/apk/debug/OpenWallpaper-${{ github.ref_name }}.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
