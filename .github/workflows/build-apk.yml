name: Build & Release APK

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          gradle-version: '9.6.0'

      - name: Verify Gradle
        run: gradle --version

      - name: Build unsigned release APK
        run: gradle --no-daemon :app:assembleRelease

      - name: Rename APK
        run: |
          mkdir -p dist
          cp app/build/outputs/apk/release/app-release-unsigned.apk "dist/OpenWallpaper-${GITHUB_REF_NAME}.apk"
          sha256sum "dist/OpenWallpaper-${GITHUB_REF_NAME}.apk" > "dist/OpenWallpaper-${GITHUB_REF_NAME}.apk.sha256"

      - name: Upload APK to GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            dist/OpenWallpaper-${{ github.ref_name }}.apk
            dist/OpenWallpaper-${{ github.ref_name }}.apk.sha256
